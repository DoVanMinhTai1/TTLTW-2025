plugins {
    id 'java-library'
    id 'maven-publish'
    id "org.hidetake.ssh" version "2.11.2"
    id 'war'
}

repositories {
    mavenCentral()

}

dependencies {
    // Provided Compile Dependency (similar to Maven's <scope>provided</scope>)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // JUnit dependencies (test scope)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

    // JSTL dependencies (same version and library from Maven)
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.1'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // MySQL Connector dependency (same version)
    implementation 'mysql:mysql-connector-java:8.0.33'

    // JDBI dependency (same version)
    implementation 'org.jdbi:jdbi3-core:3.47.0'

    // Gson library (same version)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google API client and OAuth libraries
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.http-client:google-http-client:1.43.3'
    implementation 'com.google.oauth-client:google-oauth-client:1.34.1'

    // SLF4J (Simple logging facade for Java)
    implementation 'org.slf4j:slf4j-simple:1.7.36'

    // Apache HttpClient 5 Fluent
    implementation 'org.apache.httpcomponents.client5:httpclient5-fluent:5.0'

    // dotenv-java for environment variable management
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // Jakarta Mail dependencies
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'com.sun.mail:javax.mail:1.6.2'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // https://mvnrepository.com/artifact/org.apache.poi/poi-ooxml
    implementation 'org.apache.poi:poi:5.2.3'
    implementation("org.apache.poi:poi-ooxml:5.2.3")

}

group = 'vn.edu.hcmuaf.fit'
version = '1.0-SNAPSHOT'
description = 'lab4'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

apply plugin: 'org.hidetake.ssh'
remotes {
    host {
        host = '192.168.1.40'
        user = 'root'
        password = 'centos'
    }
}
ssh.settings {
    knownHosts = allowAnyHosts
}
task docker_app_start {
    doLast {
        println 'begin docker_app_start'
        ssh.run {
            session(remotes.host) {
                execute 'docker stop tomcat9', ignoreError: true
                execute 'docker run -it --rm -d ' +
                        '--name tomcat9 ' +
                        '-v /usr/deploy:/usr/local/tomcat/webapps ' +
                        '-p 80:8080 ' +
                        'tomcat:9.0&'
            }
        }
    }
}
task docker_upload_file_to_server {
    doLast {
        println 'begin docker_upload_file_to_server'
        ssh.run {
            session(remotes.host) {
                remove '/usr/deploy/lab.war'
                remove '/usr/deploy/lab/'
                remove '/usr/deploy/lab5-1/'
                put from: "${project.projectDir}/build/libs/lab4-1.0-SNAPSHOT.war",
                        into: "/usr/deploy/lab.war"
            }
        }
    }
}

task docker_deploy {
    docker_deploy.dependsOn docker_app_start
    docker_deploy.dependsOn docker_upload_file_to_server
    docker_deploy.dependsOn build
    tasks.getByName('docker_app_start').mustRunAfter docker_upload_file_to_server
}
